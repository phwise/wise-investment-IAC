
name: Debug Terraform OIDC

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: "af-south-1"

jobs:
  oidc-debug:
    name: Debug GitHub OIDC → AWS
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Display GitHub context
      # --------------------------------------------------
      - name: Display GitHub Context
        shell: bash
        run: |
          echo "======================================"
          echo "GitHub Actions Context"
          echo "======================================"

          echo "Repository : $GITHUB_REPOSITORY"
          echo "Repository owner : $GITHUB_REPOSITORY_OWNER"
          echo "Event : $GITHUB_EVENT_NAME"
          echo "Ref : $GITHUB_REF"
          echo "SHA : $GITHUB_SHA"
          echo "Actor : $GITHUB_ACTOR"

      # --------------------------------------------------
      # 3. Check OIDC environment variables
      # --------------------------------------------------
      - name: Check OIDC Environment
        shell: bash
        run: |
          echo "======================================"
          echo "OIDC Environment"
          echo "======================================"

          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "ACTIONS_ID_TOKEN_REQUEST_URL: SET"
          else
            echo "ACTIONS_ID_TOKEN_REQUEST_URL: NOT SET"
            exit 1
          fi

          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN: SET"
          else
            echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN: NOT SET"
            exit 1
          fi

      # --------------------------------------------------
      # 4. Request GitHub OIDC token
      # --------------------------------------------------
      - name: Request GitHub OIDC Token
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "Requesting GitHub OIDC Token"
          echo "======================================"

          HTTP_STATUS=$(curl \
            --silent \
            --show-error \
            --output /tmp/oidc-response \
            --write-out "%{http_code}" \
            --header "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")

          echo "HTTP Status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "OIDC request FAILED"
            echo "Response:"
            cat /tmp/oidc-response
            exit 1
          fi

          echo "OIDC token request succeeded."

      # --------------------------------------------------
      # 5. Inspect OIDC claims WITHOUT printing token
      # --------------------------------------------------
      - name: Inspect OIDC Claims
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "Inspecting OIDC Claims"
          echo "======================================"

          RESPONSE=$(curl \
            --silent \
            --show-error \
            --header "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")

          TOKEN=$(echo "$RESPONSE" | python -c '
          import sys
          import json
          print(json.load(sys.stdin)["value"])
          ')

          PAYLOAD=$(echo "$TOKEN" | cut -d. -f2)

          python - "$PAYLOAD" <<'PY'
          import sys
          import json
          import base64

          payload = sys.argv[1]
          payload += "=" * (-len(payload) % 4)

          claims = json.loads(
              base64.urlsafe_b64decode(payload).decode("utf-8")
          )

          print("")
          print("OIDC Claims")
          print("------------------------------")

          keys = [
              "iss",
              "aud",
              "sub",
              "repository",
              "repository_owner",
              "event_name",
              "ref",
              "base_ref",
              "head_ref"
          ]

          for key in keys:
              if key in claims:
                  print(f"{key}: {claims[key]}")
          PY

      # --------------------------------------------------
      # 6. Configure AWS credentials
      # --------------------------------------------------
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # --------------------------------------------------
      # 7. Verify AWS identity
      # --------------------------------------------------
      - name: Verify AWS Identity
        shell: bash
        run: |
          echo "======================================"
          echo "AWS Identity"
          echo "======================================"

          aws sts get-caller-identity
